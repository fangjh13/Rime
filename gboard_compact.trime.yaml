# 独立主题：Gboard 紫灰·紧凑（v3）
# 参照官方 Trime v3.3.13
# 将此文件放入 Rime 用户目录，部署后选择“Gboard 紫灰·紧凑”。
# 高度：style.keyboard_height=200；每行50dp，键帽高约40dp。
# 需要稍高时改为210或220。不要仅改key_height。
# 默认中文模式；z为原始字母；长按B/L/句号发送半角分号。
# 角标中的单个空格用于隐藏长按标签，不影响长按功能。
config_version: "3.0"
name: Gboard 紫灰·紧凑
author: Screenshot-based independent theme
description: 四行 26 键，200dp 主键区，Gboard 紫灰键帽
style:
  auto_caps: false
  keyboard_height: 200
  keyboard_height_land: 160
  key_height: 50
  key_width: 10
  horizontal_gap: 5
  vertical_gap: 10
  keyboard_padding: 2
  keyboard_padding_bottom: 0
  keyboard_padding_land: 20
  keyboard_padding_land_bottom: 0
  round_corner: 8
  key_border: 0
  shadow_radius: 0
  key_text_size: 24
  key_long_text_size: 15
  symbol_text_size: 10
  key_text_offset_y: 0
  candidate_view_height: 34
  comment_height: 12
  candidate_text_size: 18
  candidate_padding: 8
  candidate_spacing: 0
  candidate_corner_radius: 8
  comment_position: right
  comment_text_size: 11
  label_text_size: 10
  popup_width: 40
  popup_height: 52
  popup_key_height: 52
  popup_bottom_margin: 56
  popup_text_size: 26
  reset_ascii_mode_on_focus_change: false
  enter_label_mode: 0
  enter_labels:
    default: ic@keyboard_return
    search: ic@magnify
    send: ic@send
    done: ic@check
    go: ic@arrow_right
    next: ic@keyboard_tab
    pre: ic@arrow_left
preedit:
  horizontal_padding: 8
  top_start_radius: 8
  top_end_radius: 8
  foreground:
    font_size: 16
preset_color_schemes:
  default:
    name: Gboard 紫灰·紧凑
    back_color: "#1C1E2A"
    root_background: "#1C1E2A"
    keyboard_back_color: "#1C1E2A"
    candidate_background: "#1C1E2A"
    liquid_keyboard_background: "#1C1E2A"
    text_back_color: "#1C1E2A"
    border_color: "#1C1E2A"
    candidate_border_color: "#1C1E2A"
    candidate_separator_color: "#00000000"
