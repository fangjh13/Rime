tool_bar:
  # primary_button 固定在左侧；buttons 会从右向左排列。
  primary_button:
    size: [36, 36]
    background:
      type: circle
      corner_radius: 10
      normal: toolbar_face
      highlight: hilited_key_back_color
      vertical_inset: 4
      horizontal_inset: 4
    foreground:
      style: ic@dots_horizontal
      normal: toolbar_text
      highlight: functional_text
      font_size: 18
      padding: 7
    action: menu_keyboard
    long_press_action: Settings

  button_spacing: 7
  back_style: ic@arrow_left

  # Buttons are listed right to left: Hide, Chinese/English, Emoji,
  # Clipboard, Editor, and Half/Full-width.
  buttons:
    - size: [36, 36]
      background:
        type: circle
        corner_radius: 10
        normal: toolbar_face
        highlight: hilited_key_back_color
        vertical_inset: 4
        horizontal_inset: 4
      foreground:
        style: ic@keyboard_close
        normal: toolbar_text
        highlight: functional_text
        font_size: 18
        padding: 7
      action: Hide

    - size: [36, 36]
      background:
        type: circle
        corner_radius: 10
        normal: toolbar_face
        highlight: hilited_key_back_color
        vertical_inset: 4
        horizontal_inset: 4
      foreground:
        option_styles: ["中", "En"]
        normal: toolbar_text
        highlight: functional_text
        font_size: 16
        padding: 8
      action: Mode_switch

    - size: [36, 36]
      background:
        type: circle
        corner_radius: 10
        normal: toolbar_face
        highlight: hilited_key_back_color
        vertical_inset: 4
        horizontal_inset: 4
      foreground:
        style: ic@emoticon
        normal: toolbar_text
        highlight: functional_text
        font_size: 18
        padding: 7
      action: liquid_keyboard_emoji

    - size: [36, 36]
      background:
        type: circle
        corner_radius: 10
        normal: toolbar_face
        highlight: hilited_key_back_color
        vertical_inset: 4
        horizontal_inset: 4
      foreground:
        style: ic@clipboard
        normal: toolbar_text
        highlight: functional_text
