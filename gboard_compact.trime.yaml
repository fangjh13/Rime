    candidate_text_color: "#E1E3EF"
    comment_text_color: "#BBC0D0"
    label_color: "#BBC0D0"
    hilited_text_color: "#E0E1FF"
    hilited_back_color: "#1C1E2A"
    hilited_candidate_text_color: "#E0E1FF"
    hilited_candidate_back_color: "#414465"
    hilited_comment_text_color: "#E0E1FF"
    hilited_label_color: "#E0E1FF"
    hilited_candidate_button_color: "#414465"
    key_back_color: "#353944"
    key_text_color: "#E1E3EF"
    key_symbol_color: "#BBC0D0"
    key_border_color: "#00000000"
    hilited_key_back_color: "#565C7C"
    hilited_key_text_color: "#E0E1FF"
    hilited_key_symbol_color: "#E0E1FF"
    hilited_key_border_color: "#00000000"
    off_key_back_color: "#414465"
    off_key_text_color: "#E0E1FF"
    off_key_symbol_color: "#BBC0D0"
    off_key_border_color: "#00000000"
    on_key_back_color: "#D3D5FC"
    on_key_text_color: "#1C1E2A"
    on_key_symbol_color: "#1C1E2A"
    on_key_border_color: "#00000000"
    hilited_off_key_back_color: "#565C7C"
    hilited_off_key_text_color: "#E0E1FF"
    hilited_off_key_symbol_color: "#E0E1FF"
