    popup_back_color: "#414465"
    popup_text_color: "#E0E1FF"
    long_text_back_color: "#353944"
    shadow_color: "#00000000"
    functional_face: "#414465"
    functional_text: "#E0E1FF"
    normal_face: "#353944"
    normal_text: "#E1E3EF"
    toolbar_face: "#1C1E2A"
    toolbar_text: "#E1E3EF"
preset_keys:
  Shift_L:
    label: ic@arrow_up_bold_outline
    send: Shift_L
    shift_lock: ascii_long
    functional: true
  BackSpace:
    label: ic@backspace_outline
    send: BackSpace
    repeatable: true
    functional: true
  Return:
    label: enter_labels
    send: Return
    functional: true
  Return_raw:
    label: ic@keyboard_return
    send: Return
    functional: true
  Space:
    label: " "
    send: space
    functional: false
    slide_cursor: true
  Mode_switch:
    toggle: ascii_mode
    send: SWITCH_CHARSET
    states:
      - 中
      - EN
  Zenkaku_Hankaku:
    toggle: full_shape
    send: SWITCH_CHARSET
    states:
      - 半角
      - 全角
  Keyboard_editor:
    label: 编辑
    functional: false
    send: Eisu_toggle
    select: editor
  Keyboard_default:
    label: 返回
    functional: false
    send: Eisu_toggle
    select: .default
  Up:
    label: ↑
    send: Up
    repeatable: true
  Down:
    label: ↓
    send: Down
    repeatable: true
  Home:
    label: Home
    send: Home
    repeatable: true
  End:
    label: End
    send: End
    repeatable: true
  Undo:
    label: 撤销
    send: Control+z
  Redo:
    label: 重做
    send: Control+y
  Tab:
    label: Tab
    send: Tab
  liquid_keyboard_emoji:
    label: 🙂
    send: FUNCTION
    command: liquid_keyboard
    # Trime v3.3.13 resolves liquid tabs by display name, not keyboard id.
    option: 表情
  IME_switch:
    label: ic@web
    send: LANGUAGE_SWITCH
    functional: true
  Menu:
    label: ic@view_grid
    send: MENU
    functional: true
  menu_keyboard:
    label: ic@view_grid
    send: FUNCTION
    command: menu_keyboard
    functional: true
  Settings:
    label: ic@cog
    send: SETTINGS
    functional: true
  Hide:
    label: ic@keyboard_close
    send: BACK
    functional: true
  Escape:
    label: ic@close_circle_outline
    send: Escape
    functional: true
  Keyboard_numbers:
    label: ?123
    send: Eisu_toggle
    select: numbers
    functional: true
  Keyboard_symbols:
    label: =\<
    send: Eisu_toggle
    select: symbols
    functional: true
  Keyboard_letters:
    label: ABC
    send: Eisu_toggle
    select: .default
    functional: true
  Emoji:
    label: ic@emoticon_outline
    send: FUNCTION
    command: liquid_keyboard
    option: 表情
  Clipboard:
    label: ic@clipboard_text_outline
    send: FUNCTION
    command: clipboard_window
    option: "0"
  Liquid_exit:
    label: 返回
    send: FUNCTION
    command: liquid_keyboard
    option: "-1"
  Liquid_space:
    label: 空格
    send: space
  Liquid_backspace:
    label: ⌫
    send: BackSpace
    repeatable: true
  Liquid_return:
    label: ↵
    send: Return
  Liquid_clipboard:
    label: 剪贴
    send: FUNCTION
    command: clipboard_window
    option: "0"
  Left:
    label: ic@arrow_left
    send: Left
  Right:
    label: ic@arrow_right
    send: Right
  Copy:
    label: 复制
    send: Control+c
  Cut:
    label: 剪切
    send: Control+x
  Paste:
    label: 粘贴
    send: Control+v
  Select_all:
    label: 全选
    send: Control+a
