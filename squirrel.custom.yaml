# https://github.com/rime/squirrel/blob/master/data/squirrel.yaml
patch:
  # never: 永远不显示中文/西文状态弹窗
  # appropriate: 默认值，状态改变时显示
  # always: 总是显示
  show_notifications_when: never

  # Menu-bar status icon.
  #   show — whether to show the icon at all; set to false for a clean menu bar.
  # The icon's text is the schema's short state label for ascii_mode (via
  # get_state_label_abbreviated). Schemas declaring `abbrev: [中, Ａ]` get
  # compact glyphs; otherwise the schema's `states:` value is used as-is.
  # Falls back to "中" / "Ａ" when no `states:` is defined.
  # NOTE: 最新正式的 Squirrel 1.1.2 版本，不支持这功能，下载 1.1.2 Nightly build 可用
  status_icon:
    show: true

  style:
    color_scheme: custom_dark

  preset_color_schemes:
    custom_dark:
      candidate_list_layout: linear # stacked 竖直排列 | linear 水平排列
      text_orientation: horizontal # horizontal | vertical
      inline_preedit: true # 单行显示，false双行显示
      candidate_format: "%c\u2005%@" # 用 1/6 em 空格 U+2005 来控制编号 %c 和候选词 %@ 前后的空间。
      corner_radius: 5 # 候选条圆角
      hilited_corner_radius: 3 # 高亮圆角
      border_height: 6 # 窗口边界高度，大于圆角半径才生效
      border_width: 6 # 窗口边界宽度，大于圆角半径才生效
      border_color_width: 0
      # font_face: "PingFangSC" # 候选词字体
      font_face: "HarmonyOS Sans SC"
      font_point: 16 # 候选字词大小
      label_font_point: 14 # 候选编号大小

      text_color: 0xdedddd # 拼音行文字颜色，24位色值，16进制，BGR顺序
      back_color: 0x252320 # 候选条背景色
      label_color: 0x888785 # 预选栏编号颜色
      # border_color: 0x020202 # 边框色
      candidate_text_color: 0xdedddd # 预选项文字颜色
      hilited_text_color: 0xdedddd # 高亮拼音 (需要开启内嵌编码)
      hilited_back_color: 0x252320 # 高亮拼音 (需要开启内嵌编码)
      hilited_candidate_text_color: 0xffffff # 第一候选项文字颜色
      hilited_candidate_back_color: 0xcb5d00 # 第一候选项背景背景色
      hilited_candidate_label_color: 0xffffff # 第一候选项编号颜色
      comment_text_color: 0xdedddd # 拼音等提示文字颜色
      #hilited_comment_text_color: 0xdedddd    # 注解文字高亮

  # Bundle Identifier 查找方法：
  # 右键『应用.app』-> 显示包内容
  # Contents/Info.plist -> BundleIdentifier
  # Bundle Identifier:
  #   ascii_mode: true     默认英文（只在应用首次获得焦点时生效一次，此后会记住状态，也就是不会每次都切到该应用就变成英文）
  #   ascii_mode: false    默认中文
  #   ascii_punct: true    开启英文标点
  #   vim_mode: true       按esc切英文
  #   no_inline: true      不使用行內編輯
  app_options:
    com.apple.Spotlight:
      ascii_mode: true
    com.apple.systempreferences:
      ascii_mode: true
